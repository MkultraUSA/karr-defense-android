name: KARR Defense Android CI

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "emulator" "system-images;android-34;google_apis;x86_64" 2>&1

      - name: Build debug APK (manual toolchain, bash)
        run: |
          JDK_HOME=$(dirname $(dirname $(readlink -f $(which javac))))
          SDK_ROOT=$ANDROID_SDK_ROOT
          BT=$SDK_ROOT/build-tools/35.0.1
          AJ=$SDK_ROOT/platforms/android-35/android.jar
          ROOT=$(pwd)
          MANUAL=$ROOT/manual-build
          OUT=$ROOT/app/build/outputs/apk/debug
          KEYSTORE=$ROOT/debug.keystore

          mkdir -p "$MANUAL"/{classes,gen,compiled,dex}
          mkdir -p "$OUT"

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkey -v \
              -keystore "$KEYSTORE" \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" 2>&1 | tail -3
          fi

          $BT/aapt2 compile --dir "$ROOT/app/src/main/res" -o "$MANUAL/compiled.zip" 2>&1

          $BT/aapt2 link \
            -I "$AJ" \
            --manifest "$ROOT/app/src/main/AndroidManifest.xml" \
            --java "$MANUAL/gen" \
            -o "$MANUAL/unsigned.apk" \
            --auto-add-overlay \
            --min-sdk-version 23 \
            --target-sdk-version 35 \
            "$MANUAL/compiled.zip" 2>&1

          JAVA_FILES=$(find "$ROOT/app/src/main/java" -name "*.java" | tr "\n" " ")
          "$JDK_HOME/bin/javac" \
            -source 8 -target 8 \
            -classpath "$AJ" \
            -encoding UTF-8 \
            -d "$MANUAL/classes" \
            $JAVA_FILES \
            "$MANUAL/gen/com/codex/karrdefense/R.java" 2> build-errors.log || { cat build-errors.log; exit 1; }

          "$JDK_HOME/bin/jar" cf "$MANUAL/classes.jar" -C "$MANUAL/classes" . 2>&1

          "$JDK_HOME/bin/java" -cp "$BT/lib/d8.jar" \
            com.android.tools.r8.D8 \
            --min-api 23 \
            --output "$MANUAL/dex" \
            "$MANUAL/classes.jar" 2>&1

          "$JDK_HOME/bin/jar" uf "$MANUAL/unsigned.apk" -C "$MANUAL/dex" classes.dex 2>&1

          $BT/zipalign -f -p 4 "$MANUAL/unsigned.apk" "$MANUAL/aligned.apk" 2>&1

          $BT/apksigner sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUT/karr-defense-inspector-debug.apk" \
            "$MANUAL/aligned.apk" 2>&1

          $BT/apksigner verify "$OUT/karr-defense-inspector-debug.apk" 2>&1

          ls -lh "$OUT/karr-defense-inspector-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karr-defense-debug-apk
          path: app/build/outputs/apk/debug/karr-defense-inspector-debug.apk

      - name: Enable KVM
        run: |
          echo "KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"" | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/karr-defense-inspector-debug.apk
            adb shell am start -n com.codex.karrdefense/.MainActivity
            sleep 20
            adb shell screencap -p /sdcard/shot.png
            adb pull /sdcard/shot.png ./smoke-shot.png
            adb logcat -d | grep -iE "fatal|exception|crash" && exit 1 || echo "no fatal in logcat"

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: smoke-shot.png
