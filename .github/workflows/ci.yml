name: KARR Defense Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "emulator" "system-images;android-34;google_apis;x86_64" --yes 2>&1

      - name: Build debug APK (manual toolchain, bash)
        run: |
          set -euo pipefail
          SDK_ROOT=$ANDROID_SDK_ROOT
          BT=$SDK_ROOT/build-tools/35.0.1
          AJ=$SDK_ROOT/platforms/android-35/android.jar
          OUT=manual-build
          APK=app/build/outputs/apk/debug/karr-defense-inspector-debug.apk

          rm -rf "$OUT" build-errors.log
          mkdir -p "$OUT/gen" "$OUT/classes" "$OUT/dex" app/build/outputs/apk/debug

          # 1/5 resources + R.java. build-tools 35.0.1 aapt2 has no `package`
          # subcommand and no -f/-m/-S flags: compile a flat archive, then link.
          "$BT/aapt2" compile --dir app/src/main/res -o "$OUT/compiled.zip"
          "$BT/aapt2" link -o "$OUT/base.apk" \
            --manifest app/src/main/AndroidManifest.xml \
            -I "$AJ" \
            -R "$OUT/compiled.zip" \
            --java "$OUT/gen" \
            --auto-add-overlay \
            --min-sdk-version 23 --target-sdk-version 35

          # 2/5 Java 8 bytecode against the API 35 android.jar
          find app/src/main/java -name '*.java' > "$OUT/javafiles.txt"
          echo "$OUT/gen/com/codex/karrdefense/R.java" >> "$OUT/javafiles.txt"
          javac -source 8 -target 8 -classpath "$AJ" -encoding UTF-8 \
            -d "$OUT/classes" @"$OUT/javafiles.txt" 2> build-errors.log \
            || { cat build-errors.log; exit 1; }

          # 3/5 dex. dx.jar was removed from modern build-tools; d8 replaces it
          # (and desugars the Java 8 lambdas used throughout MainActivity).
          find "$OUT/classes" -name '*.class' > "$OUT/classlist.txt"
          "$BT/d8" --lib "$AJ" --min-api 23 --output "$OUT/dex" @"$OUT/classlist.txt"

          # 4/5 package: base resources APK + classes.dex
          cp "$OUT/base.apk" "$OUT/unsigned.apk"
          (cd "$OUT/dex" && zip -q "$OUT/unsigned.apk" classes.dex)

          # 5/5 align + sign with a throwaway debug key so the APK installs
          keytool -genkeypair -keystore "$OUT/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          "$BT/zipalign" -f 4 "$OUT/unsigned.apk" "$OUT/aligned.apk"
          "$BT/apksigner" sign --ks "$OUT/debug.keystore" \
            --ks-pass pass:android --key-pass pass:android \
            --out "$APK" "$OUT/aligned.apk"

          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|launchable-activity"
          ls -l "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karr-defense-debug-apk
          path: app/build/outputs/apk/debug/karr-defense-inspector-debug.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/karr-defense-inspector-debug.apk
            adb shell am start -n com.codex.karrdefense/.MainActivity
            sleep 20
            adb shell screencap -p /sdcard/shot.png
            adb pull /sdcard/shot.png ./smoke-shot.png
            echo '--- crash buffer ---'
            adb logcat -d -b crash
            if adb logcat -d -b crash | grep -qE 'FATAL EXCEPTION|AndroidRuntime'; then exit 1; fi
            echo 'no fatal exception in crash buffer'

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: smoke-shot.png
